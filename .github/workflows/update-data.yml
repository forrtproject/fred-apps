name: Refresh FReD Static Data

# Reusable workflow that regenerates Explorer & FLoRA JSON and downloads
# Retraction Watch into the `data-latest` GitHub Release without committing
# any dataset blobs to git. Each dataset refreshes independently: if one
# upstream fails, its last verified baseline file is carried forward.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      FRED_OFFLINE: "FALSE"
      RELEASE_TAG: data-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest verified baseline bundle
        run: |
          mkdir -p _work/baseline _work/candidate
          bash scripts/fetch-data.sh _work/baseline
          cp _work/baseline/* _work/candidate/

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("remotes", "dplyr", "jsonlite", "stringr", "readr"))'
          Rscript -e 'remotes::install_github("forrtproject/fred")'

      - name: Refresh Explorer data (independent)
        id: explorer
        run: |
          mkdir -p _work/try_explorer
          if (cd preprocessing && Rscript process-explorer-data.R ../_work/try_explorer) \
             && python3 scripts/validate-data.py validate _work/try_explorer --only explorer --baseline _work/baseline; then
            cp -f _work/try_explorer/explorer-data.json _work/candidate/explorer-data.json
            echo "status=updated" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Explorer refresh failed; carrying forward last validated explorer-data.json."
            echo "status=carried-forward" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh FLoRA data (independent)
        id: flora
        run: |
          mkdir -p _work/try_flora
          if (cd preprocessing && Rscript process-flora-data.R ../_work/try_flora) \
             && python3 scripts/validate-data.py validate _work/try_flora --only flora --baseline _work/baseline; then
            cp -f _work/try_flora/flora-data.json _work/candidate/flora-data.json
            echo "status=updated" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::FLoRA refresh failed; carrying forward last validated flora-data.json."
            echo "status=carried-forward" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh Retraction Watch data (independent)
        id: retraction
        run: |
          mkdir -p _work/try_rw
          if curl -fsSL --retry 3 --retry-delay 5 \
               -o _work/try_rw/retraction-watch.csv \
               "https://gitlab.com/crossref/retraction-watch-data/-/raw/main/retraction_watch.csv?ref_type=heads" \
             && gzip -n -f _work/try_rw/retraction-watch.csv \
             && gzip -t _work/try_rw/retraction-watch.csv.gz \
             && python3 scripts/validate-data.py validate _work/try_rw --only retraction --baseline _work/baseline; then
            cp -f _work/try_rw/retraction-watch.csv.gz _work/candidate/retraction-watch.csv.gz
            echo "status=updated" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Retraction Watch refresh failed; carrying forward last validated retraction-watch.csv.gz."
            echo "status=carried-forward" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate complete candidate bundle and check for real data changes
        id: diff
        run: |
          python3 scripts/validate-data.py validate _work/candidate --baseline _work/baseline
          DIFF_JSON=$(python3 scripts/validate-data.py diff _work/baseline _work/candidate)
          echo "Diff result: $DIFF_JSON"
          CHANGED=$(python3 -c 'import json,sys; print("true" if json.loads(sys.argv[1])["changed"] else "false")' "$DIFF_JSON")
          FILES=$(python3 -c 'import json,sys; print(", ".join(json.loads(sys.argv[1])["files"]))' "$DIFF_JSON")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Publish verified bundle to data-latest Release and prune older assets
        if: steps.diff.outputs.changed == 'true'
        run: |
          BUNDLE="fred-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          (
            cd _work/candidate
            sha256sum explorer-data.json flora-data.json retraction-watch.csv.gz > SHA256SUMS
            tar -czf "../${BUNDLE}" explorer-data.json flora-data.json retraction-watch.csv.gz SHA256SUMS
          )

          # Upload under a unique asset name (never --clobber) so the predecessor stays intact
          gh release upload "$RELEASE_TAG" "_work/${BUNDLE}"

          # Verify the newly published asset downloads cleanly and passes checksum + schema checks
          mkdir -p _work/verify
          bash scripts/fetch-data.sh _work/verify

          # Retain only the 2 newest uploaded bundles so rollback is always available
          mapfile -t OLD_ASSETS < <(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '[.assets[] | select(.state == "uploaded" and (.name | startswith("fred-data-")) and (.name | endswith(".tar.gz")))] | sort_by(.created_at) | reverse | .[2:] | .[].name'
          )
          for old in "${OLD_ASSETS[@]}"; do
            [ -n "$old" ] || continue
            echo "Pruning superseded bundle: $old"
            gh release delete-asset "$RELEASE_TAG" "$old" --yes
          done

      - name: Write refresh summary
        run: |
          {
            echo "### Data Refresh Summary"
            echo "- Explorer: \`${{ steps.explorer.outputs.status }}\`"
            echo "- FLoRA: \`${{ steps.flora.outputs.status }}\`"
            echo "- Retraction Watch: \`${{ steps.retraction.outputs.status }}\`"
            echo "- Bundle changed: \`${{ steps.diff.outputs.changed }}\` (${{ steps.diff.outputs.files || 'none' }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if all three upstreams failed
        if: >-
          steps.explorer.outputs.status == 'carried-forward' &&
          steps.flora.outputs.status == 'carried-forward' &&
          steps.retraction.outputs.status == 'carried-forward'
        run: |
          echo "::error::All three upstream dataset refreshes failed."
          exit 1
